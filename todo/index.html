<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Checkbox – CSS Experiments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="../index.html">← Zurück zur Übersicht</a>
    </nav>

    <main>
        <h1>Animierte Checkbox</h1>
        <p class="intro">Checkmark-Animation per <code>border-width</code> und <code>opacity</code> – kein JavaScript.</p>

        <div class="todolist">
            <div class="todolist_container">

                <div class="todolist_row">
                    <p>Farbslider-Effekt</p>
                    <label class="todo_label">
                        <input class="todo_input" type="checkbox" checked>
                        <span class="todo_text"></span>
                    </label>
                </div>

                <div class="todolist_row">
                    <p>Textflip-Effekt</p>
                    <label class="todo_label">
                        <input class="todo_input" type="checkbox" checked>
                        <span class="todo_text"></span>
                    </label>
                </div>

                <div class="todolist_row">
                    <p>Loader-Animation</p>
                    <label class="todo_label">
                        <input class="todo_input" type="checkbox" checked>
                        <span class="todo_text"></span>
                    </label>
                </div>

                <div class="todolist_row">
                    <p>Sibling-Fade</p>
                    <label class="todo_label">
                        <input class="todo_input" type="checkbox">
                        <span class="todo_text"></span>
                    </label>
                </div>

                <div class="todolist_row">
                    <p>Noch mehr Experimente...</p>
                    <label class="todo_label">
                        <input class="todo_input" type="checkbox">
                        <span class="todo_text"></span>
                    </label>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
